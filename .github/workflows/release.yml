name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        # cargo publish creates target/package output that rust-cache's
        # post-save target cleanup can misclassify as test artifacts.
        save-if: "false"

    - name: Run tests before publish
      run: cargo test --all-features

    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
      with:
        tool: cargo-semver-checks
    
    - name: Check semver compatibility
      run: cargo semver-checks check-release

    - name: Authenticate with crates.io
      id: auth
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

    - name: Publish to crates.io
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/v')
      run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
      env:
        GH_TOKEN: ${{ github.token }}
