name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  id-token: write

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        # cargo publish creates target/package output that rust-cache's
        # post-save target cleanup can misclassify as test artifacts.
        save-if: "false"

    - name: Run tests before publish
      run: cargo test --all-features

    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
      with:
        tool: cargo-semver-checks
    
    - name: Check semver compatibility
      run: cargo semver-checks check-release

    - name: Authenticate with crates.io
      id: auth
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

    - name: Publish to crates.io
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/v')
      run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
      env:
        GH_TOKEN: ${{ github.token }}
