name: Fresh Dependencies

on:
  workflow_dispatch:
  schedule:
    # Weekly check that the crate still works with the newest dependency
    # versions allowed by Cargo.toml.
    - cron: "0 12 * * 2"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fresh-resolution:
    name: Fresh Dependency Resolution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny

      - name: Resolve latest allowed dependencies
        run: |
          cargo update
          git diff -- Cargo.lock

      - name: Check fresh dependency graph
        run: cargo check --all-targets --all-features

      - name: Audit fresh dependency graph
        run: cargo audit

      - name: Deny policy check on fresh dependency graph
        run: cargo deny check
