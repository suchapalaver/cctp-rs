name: Fresh Dependencies

on:
  workflow_dispatch:
  schedule:
    # Weekly check that the crate still works with the newest dependency
    # versions allowed by Cargo.toml.
    - cron: "0 12 * * 2"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fresh-resolution:
    name: Fresh Dependency Resolution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-deny

      - name: Resolve latest allowed dependencies
        run: |
          cargo update
          git diff -- Cargo.lock

      - name: Check fresh dependency graph
        run: cargo check --all-targets --all-features

      - name: Audit fresh dependency graph
        run: cargo audit --deny unsound

      - name: Deny policy check on fresh dependency graph
        run: cargo deny check
