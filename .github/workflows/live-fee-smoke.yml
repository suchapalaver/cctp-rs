name: Live CCTP Fee Smoke

on:
  workflow_dispatch:
  schedule:
    # Weekly drift check for Circle Iris fee response shape.
    - cron: "0 12 * * 1"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  live-fee-smoke:
    name: Live Iris Fee Smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run live fee smoke tests
        run: |
          cargo test --test transfer_fees live_ \
            --all-features -- --ignored --nocapture
