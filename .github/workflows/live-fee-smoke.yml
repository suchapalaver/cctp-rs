name: Live CCTP Fee Smoke

on:
  workflow_dispatch:
  schedule:
    # Weekly drift check for Circle Iris fee response shape.
    - cron: "0 12 * * 1"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  live-fee-smoke:
    name: Live Iris Fee Smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run live fee smoke tests
        run: |
          cargo test --test transfer_fees live_ \
            --all-features -- --ignored --nocapture
