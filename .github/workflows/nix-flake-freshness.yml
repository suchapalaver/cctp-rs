name: Nix Flake Freshness

on:
  workflow_dispatch:
  schedule:
    # Dependabot does not update Nix inputs. Detect drift weekly without
    # creating unsigned automation commits.
    - cron: "0 14 * * 3"

permissions:
  contents: read

jobs:
  freshness:
    name: Nix Flake Freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Refresh flake inputs in the runner workspace
        run: nix flake update

      - name: Validate the refreshed flake
        run: nix flake check --all-systems

      - name: Require the committed lockfile to be current
        run: git diff --exit-code -- flake.lock
