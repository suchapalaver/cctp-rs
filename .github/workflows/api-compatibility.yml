name: API Compatibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  api-compatibility:
    name: Pull Request API Compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve pull request merge base
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="$(git merge-base HEAD "$BASE_SHA")"
          test -n "$baseline"
          echo "revision=$baseline" >> "$GITHUB_OUTPUT"

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2
        with:
          tool: cargo-semver-checks

      - name: Compare public API with pull request base
        env:
          BASELINE_REV: ${{ steps.baseline.outputs.revision }}
          SEMVER_RELEASE_TYPE: ${{ contains(github.event.pull_request.labels.*.name, 'semver-major-approved') && 'major' || 'minor' }}
        run: cargo semver-checks check-release --baseline-rev "$BASELINE_REV" --release-type "$SEMVER_RELEASE_TYPE"
