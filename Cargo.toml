[package]
name = "cctp-rs"
version = "7.1.0"
edition = "2021"
authors = ["Joseph Livesey <jlivesey@gmail.com>"]
categories = ["finance", "api-bindings"]
description = "Type-safe Rust SDK for Circle's Cross-Chain Transfer Protocol (CCTP) v1 and v2 — bridge USDC across 11 v2-capable EVM chain families with fast transfer support; protocol parser implements all 30 current CCTP domain IDs."
homepage = "https://crates.io/crates/cctp-rs"
keywords = ["cctp", "usdc", "circle", "bridge", "alloy"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/suchapalaver/cctp-rs"

[dependencies]
alloy-chains = "0.2"
# Fresh release-time checks do not always use this repository's lockfile.
# These caps keep Alloy resolution on the tested 2.1.x line until every
# release-check environment is newer than the rust-version declared by Alloy 2.2+.
alloy-consensus = { version = ">=2.0, <2.2.0", default-features = false }
alloy-consensus-any = { version = ">=2.0, <2.2.0", default-features = false }
alloy-contract = { version = ">=2.0, <2.2.0", default-features = false }
alloy-eips = { version = ">=2.0, <2.2.0", default-features = false }
alloy-genesis = { version = ">=2.0, <2.2.0", default-features = false }
alloy-json-rpc = { version = ">=2.0, <2.2.0", default-features = false }
alloy-network = { version = ">=2.0, <2.2.0", default-features = false }
alloy-network-primitives = { version = ">=2.0, <2.2.0", default-features = false }
alloy-primitives = { version = "1.6", default-features = false, features = [
    "serde",
    "std",
    "rlp",
] }
alloy-provider = { version = ">=2.0, <2.2.0", default-features = false, features = [
    "anvil-node",
    "reqwest",
] }
alloy-rpc-types = ">=2.0, <2.2.0"
alloy-rpc-types-anvil = { version = ">=2.0, <2.2.0", default-features = false }
alloy-rpc-types-any = { version = ">=2.0, <2.2.0", default-features = false }
alloy-rpc-types-eth = { version = ">=2.0, <2.2.0", default-features = false }
alloy-serde = { version = ">=2.0, <2.2.0", default-features = false }
alloy-signer = { version = ">=2.0, <2.2.0", default-features = false }
alloy-sol-types = { version = "1.6", features = ["json"] }
alloy-transport = { version = ">=2.0, <2.2.0", default-features = false }
alloy-tx-macros = { version = ">=2.0, <2.2.0", default-features = false }
async-trait = "0.1"
bon = "3.9"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["time"] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
alloy-rpc-client = { version = ">=2.0, <2.2.0", default-features = false }
alloy-signer-local = ">=2.0, <2.2.0"
dotenvy = "0.15"
insta = "1.47"
rstest = "0.26"
tokio = { version = "1.52", features = [
    "test-util",
    "macros",
    "rt-multi-thread",
] }
tower = { version = "0.5", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
